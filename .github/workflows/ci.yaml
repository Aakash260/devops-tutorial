name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  client:
    name: Client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  deploy:
    name: Deploy to AWS EC2
    needs: [client, server]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            # 1. Ensure Git is installed
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing..."
              if command -v apt-get &> /dev/null; then
                sudo apt-get update -y && sudo apt-get install -y git
              elif command -v dnf &> /dev/null; then
                sudo dnf install -y git
              elif command -v yum &> /dev/null; then
                sudo yum install -y git
              fi
            fi

            # 2. Ensure Docker & Docker Compose are installed
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing..."
              if command -v apt-get &> /dev/null; then
                sudo apt-get update -y && sudo apt-get install -y docker.io docker-compose-v2
                sudo systemctl enable --now docker
                sudo usermod -aG docker $USER || true
              elif command -v dnf &> /dev/null; then
                sudo dnf install -y docker
                sudo systemctl enable --now docker
                sudo usermod -aG docker $USER || true
              elif command -v yum &> /dev/null; then
                sudo yum install -y docker
                sudo systemctl enable --now docker
                sudo usermod -aG docker $USER || true
              fi
            fi

            # Determine docker command (handles non-root permissions before re-login)
            DOCKER_CMD="docker compose"
            if ! docker info >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker compose"
            fi

            # 3. Navigate to the project directory, or clone if not present
            if [ -d ~/devops-tutorial ]; then
              cd ~/devops-tutorial
            elif [ -d ~/devops-youtube-course-2025 ]; then
              cd ~/devops-youtube-course-2025
            else
              git clone https://github.com/Aakash260/devops-tutorial.git ~/devops-tutorial
              cd ~/devops-tutorial
            fi

            # 4. Pull the latest code
            git pull origin main

            # 5. Recreate server/.env if secret is configured (since .env is gitignored)
            if [ -n "${{ secrets.MONGO_URI }}" ]; then
              echo "PORT=5000" > server/.env
              echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> server/.env
            fi

            # 6. Rebuild and restart containers
            $DOCKER_CMD down || true
            $DOCKER_CMD up -d --build
